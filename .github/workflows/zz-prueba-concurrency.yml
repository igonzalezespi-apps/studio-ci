# PRUEBA TEMPORAL: no se mergea. Mide el grupo de concurrency que cancela solo lo superado por un
# commit nuevo de la misma PR.
name: zz-prueba-concurrency

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && (contains(fromJSON('["opened","synchronize"]'), github.event.action) && format('pr-{0}', github.event.pull_request.number) || format('pr-{0}-{1}', github.event.pull_request.number, github.event.pull_request.head.sha)) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && contains(fromJSON('["opened","synchronize"]'), github.event.action) }}

permissions:
  contents: read

jobs:
  espera:
    name: espera
    runs-on: ubuntu-latest
    steps:
      - run: echo "evento=${{ github.event.action }} sha=${{ github.event.pull_request.head.sha }}"; sleep 150
