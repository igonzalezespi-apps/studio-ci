name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    name: validate actions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: action.yml files are valid YAML and declare composite runs
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          ok = True
          for f in sorted(glob.glob('*/action.yml')):
              d = yaml.safe_load(open(f))
              using = (d.get('runs') or {}).get('using')
              status = 'OK' if using == 'composite' else f'NOT composite ({using})'
              if using != 'composite':
                  ok = False
              print(f'{f}: {status}')
          sys.exit(0 if ok else 1)
          PY

      # Los *.test.sh se ejecutan aquí porque un test que nadie corre es documentación, no un
      # gate. El descubrimiento es por glob y no por lista: una lista se queda corta el día que
      # alguien añade un test, y ese día el fallo es silencioso — el test existe, está verde en
      # local, y el CI no lo mira.
      - name: shell tests
        run: |
          set -euo pipefail
          shopt -s nullglob
          tests=(*/*.test.sh)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "no hay *.test.sh todavía"; exit 0
          fi
          rc=0
          for t in "${tests[@]}"; do
            echo "── $t ──"
            bash "$t" || rc=1
          done
          exit $rc
