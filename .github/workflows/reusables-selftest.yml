# Ejecuta en GitHub los workflows reutilizables de este repo, llamados DESDE SU PROPIA RUTA
# (`./.github/workflows/...`) y no desde un tag: cada PR que los toca prueba lo que recibira el
# consumidor con el tag siguiente — el `concurrency` evaluado por GitHub, los permisos heredados, la
# descarga verificada de gitleaks y la lectura real del Dependency Dashboard —, que es justo lo que
# las suites locales (`*.test.sh`) no pueden ver.
#
# Solo en las PRs que tocan esos ficheros, y el heartbeat sin ping (`ping: false`): una PR no marca
# casillas en el dashboard; el ping es cosa de la ejecucion programada de cada consumidor.
#
# Sin `concurrency` a proposito: el reutilizable trae el suyo, y `caller-guard` rechazaria uno aqui
# en cuanto este workflow escuchara eventos de etiqueta.
name: reusables-selftest

on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - .github/workflows/renovate-heartbeat.yml
      - .github/workflows/reusables-selftest.yml
      - .github/workflows/merge-when-green.yml
      - .github/workflows/develop-health.yml
      - risk-class/**
      - merge-when-green/**
      - develop-health/**
      - revert-merge/**

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  renovate-heartbeat:
    uses: ./.github/workflows/renovate-heartbeat.yml
    with:
      ping: false

  # Autonomous merging, DRY and with no write at all (`selftest: true`): proves in GitHub what the
  # local suites cannot — the code checked out at `job.workflow_sha`, the sparse read of this repo's
  # default branch, the real API answers for this very PR and for `develop`. The calling jobs grant
  # write scopes only because a called job may not ask for more than its caller; in self-test
  # nothing is written (no comment, no label, no merge job: `live` is never true on a PR).
  merge-when-green:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      actions: read
      checks: read
      statuses: read
    uses: ./.github/workflows/merge-when-green.yml
    with:
      selftest: true
      mode: dry
      pr: "${{ github.event.pull_request.number }}"
      comment: false

  develop-health:
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: write
      checks: read
      statuses: read
    uses: ./.github/workflows/develop-health.yml
    with:
      selftest: true
      mode: dry
