# Ejecuta en GitHub los workflows reutilizables de este repo, llamados DESDE SU PROPIA RUTA
# (`./.github/workflows/...`) y no desde un tag: cada PR que los toca prueba lo que recibira el
# consumidor con el tag siguiente — el `concurrency` evaluado por GitHub, los permisos heredados, la
# descarga verificada de gitleaks y la lectura real del Dependency Dashboard —, que es justo lo que
# las suites locales (`*.test.sh`) no pueden ver.
#
# Solo en las PRs que tocan esos ficheros, y el heartbeat sin ping (`ping: false`): una PR no marca
# casillas en el dashboard; el ping es cosa de la ejecucion programada de cada consumidor.
#
# Sin autotest de merge-when-green.yml ni de develop-health.yml: en modo selftest leen la politica
# de la guarda de la rama por defecto de este repo, y este repo ya no la tiene; sus suites locales
# (`*.test.sh`) y el job `hosted-image-expression` siguen cubriendolos.
#
# Sin `concurrency` a proposito: el reutilizable trae el suyo, y `caller-guard` rechazaria uno aqui
# en cuanto este workflow escuchara eventos de etiqueta.
name: reusables-selftest

on:
  pull_request:
    paths:
      - .github/workflows/security.yml
      - .github/workflows/renovate-heartbeat.yml
      - .github/workflows/reusables-selftest.yml
      - .github/workflows/merge-when-green.yml
      - .github/workflows/develop-health.yml

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  security:
    uses: ./.github/workflows/security.yml

  renovate-heartbeat:
    uses: ./.github/workflows/renovate-heartbeat.yml
    with:
      ping: false

  # The hosted-image test in the `if:` of the plan job of merge-when-green.yml and the assess job
  # of develop-health.yml only runs in a private repository, so GitHub never evaluates it here. This
  # job has GitHub's own evaluator compute the same expression over the runner values that matter (a
  # label, a JSON list, capitals, an own label that merely contains a hosted prefix). merge-autonomo.test.sh checks that it is the same
  # expression as in both workflows, with `inputs.runs-on` read from the matrix.
  hosted-image-expression:
    name: hosted image? ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: ubuntu-latest, hosted: "true" }
          - { label: macos-14, hosted: "true" }
          - { label: windows-2025, hosted: "true" }
          - { label: Ubuntu-24.04, hosted: "true" }
          - { label: '["ubuntu-latest"]', hosted: "true" }
          - { label: '["gpu", "macos-15"]', hosted: "true" }
          - { label: '["WINDOWS-LATEST"]', hosted: "true" }
          - { label: studio, hosted: "false" }
          - { label: '["studio", "gpu"]', hosted: "false" }
          - { label: gpu-ubuntu-box, hosted: "false" }
          - { label: '["gpu", "my-macos-box"]', hosted: "false" }
    steps:
      - name: Evaluate
        env:
          GOT: >-
            ${{
            contains(format(',{0}', join(startsWith(matrix.label, '[') && fromJSON(matrix.label) || matrix.label, ',')), ',ubuntu-') ||
            contains(format(',{0}', join(startsWith(matrix.label, '[') && fromJSON(matrix.label) || matrix.label, ',')), ',windows-') ||
            contains(format(',{0}', join(startsWith(matrix.label, '[') && fromJSON(matrix.label) || matrix.label, ',')), ',macos-')
            }}
          WANT: ${{ matrix.hosted }}
        run: |
          echo "hosted: $GOT (want $WANT)"
          [ "$GOT" = "$WANT" ]
