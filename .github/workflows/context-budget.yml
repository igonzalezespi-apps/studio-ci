# Lo que Claude Code carga en cada sesion (CLAUDE.md, estilo de salida, descripciones de skills y
# agentes) tiene presupuesto, y la configuracion que decide QUE se carga tiene que resolver a algo
# que existe. Aqui la accion `context-budget` mide a ESTE repo (plan maestro E5.1b).
#
# Se ejecuta desde SU PROPIA RUTA (`./context-budget`), no desde un tag: asi cada PR prueba en
# GitHub lo que recibira el consumidor con el tag siguiente —la expresion por defecto de `labels`,
# la lectura de `.github/context-budget.json`, las anotaciones y el resumen del paso—, que es justo
# lo que las suites locales no pueden ver. Por eso tampoco lee las etiquetas en vivo, como hacen los
# consumidores: aqui se prueba el valor por defecto que trae la accion.
#
# SOLO AVISO: el modo, con su porque, esta en `.github/context-budget.json` (asi una ejecucion
# local da lo mismo que la CI). Un rojo permanente aqui enseñaria a ignorarlo.
#
# Escucha `labeled`/`unlabeled` porque la aprobacion de un exceso de presupuesto va por etiqueta
# (`presupuesto-contexto-aprobado`). Por eso vive en su propio workflow y no en ci.yml: alli una
# etiqueta relanzaria tambien las suites, y su `concurrency` cancelaria el run de `opened` al
# llegar el de `labeled`, que es un check rojo que no corresponde a ningun fallo. SIN `concurrency`,
# como pr-tldr.yml. `ubuntu-latest` fijo, NUNCA `vars.RUNNER_TARGET`: este repo es publico.
name: context-budget

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

jobs:
  context-budget:
    name: context-budget (este repo, solo aviso)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./context-budget
