name: guard-selftest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  guard:
    name: vendored bash-guard self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The vendored guard extracts the command and reads its policy via node,
      # so node must be present for the suite to exercise real verdicts.
      - name: PINS — ninguna accion clavada a un alias flotante
        # La sexta comprobacion es la razon de que esta accion exista, y no la tenia ningun
        # verificador de la flota: un pin comentado como `# v7` cuando existe `# v7.0.1`.
        # Renovate trata el primero como cambio de DIGEST, que no lleva `releaseTimestamp`, asi
        # que con `minimumReleaseAgeBehaviour` en su valor por defecto esa actualizacion NO PUEDE
        # satisfacer la reja de edad jamas — y no da rojo: la PR se queda parada en silencio.
        #
        # Va en este workflow y no en uno propio porque es lo mismo que el resto: higiene del
        # repo comprobada DISPARANDO, sobre el checkout que ya esta hecho, sin un runner mas.
        #
        # Su contrato de salida distingue las tres respuestas: 0 sanos, 1 al menos una violacion,
        # y 2 NO SE PUDO MEDIR (sin `gh`, API caida, o cero workflows — un glob roto no es un
        # verde). Los tres hacen lo correcto aqui: solo el 0 deja pasar.
        uses: igonzalezespi-apps/studio-ci/check-action-pins@bab8a68625f3f0299041a07afb273a0b997c2b81 # v0.6.0
        with:
          github-token: ${{ github.token }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: bash-guard self-test (all cases pass, suite never shrinks)
        # Este repo VENDORIZA el guard y hasta ahora no corria su suite: solo comprobaba disparo y
        # cableado. Un guard que se rompe no da error, deja de denegar — y eso el disparo puntual no
        # lo ve. El total NO va clavado: la asercion `grep -q 'OK: 100/100'` de los repos hermanos se
        # ponia roja cada vez que el guard GANABA casos. Se comprueba `pass == total` mas un suelo.
        run: |
          set -o pipefail
          bash scripts/hooks/bash-guard.test.sh | tee "$RUNNER_TEMP/bash-guard.out"
          res=$(sed -nE 's/^OK: ([0-9]+)\/([0-9]+) cases pass.*/\1 \2/p' "$RUNNER_TEMP/bash-guard.out" | tail -1)
          [ -n "$res" ] || { echo "::error::bash-guard self-test printed no result line at all"; exit 1; }
          pass=${res% *}; total=${res#* }
          [ "$pass" = "$total" ] || { echo "::error::bash-guard self-test: only $pass of $total cases pass"; exit 1; }
          [ "$total" -ge 107 ] || { echo "::error::bash-guard self-test SHRANK to $total cases (floor is 107)"; exit 1; }

      - name: guard table suite
        run: bash scripts/hooks/bash-guard.test.sh

      - name: liveness — a forbidden push must deny (exit 2)
        run: |
          input='{"tool_name":"Bash","tool_input":{"command":"git push origin main"}}'
          rc=0
          printf '%s' "$input" | BASH_GUARD_BRANCH=feature/1-x bash scripts/hooks/bash-guard.sh >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "FAIL: forbidden 'git push origin main' returned exit $rc (expected 2) — the guard is INERT"
            exit 1
          fi
          echo "OK: forbidden push denied (exit 2), guard fires"

      - name: liveness — a benign command must be allowed (exit 0)
        run: |
          input='{"tool_name":"Bash","tool_input":{"command":"git status"}}'
          rc=0
          printf '%s' "$input" | BASH_GUARD_BRANCH=feature/1-x bash scripts/hooks/bash-guard.sh >/dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "FAIL: benign 'git status' returned exit $rc (expected 0)"
            exit 1
          fi
          echo "OK: benign command allowed (exit 0)"

      - name: wiring — guard is cabled as a PreToolUse Bash hook
        run: |
          node -e '
            const fs = require("fs");
            const s = JSON.parse(fs.readFileSync(".claude/settings.json", "utf8"));
            const pre = (s.hooks && s.hooks.PreToolUse) || [];
            const cabled = pre.some(g =>
              (g.matcher || "").split("|").includes("Bash") &&
              (g.hooks || []).some(h => typeof h.command === "string" && h.command.includes("bash-guard.sh")));
            if (!cabled) { console.error("FAIL: bash-guard.sh is not cabled as a PreToolUse Bash hook in .claude/settings.json"); process.exit(1); }
            console.log("OK: bash-guard.sh cabled as a PreToolUse Bash hook");
          '
