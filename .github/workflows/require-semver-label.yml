# Adaptado del workflow homólogo de los productos, con DOS cambios que no son cosméticos:
#
#  1. `branches: [main, develop]`. Este repo fue trunk→main hasta la FASE 3; desde entonces el trabajo
#     entra en `develop` y la promoción `develop` → `main` corta la release. Vigilar solo `main`
#     dejaba sin control justo las PRs que llevan la etiqueta que decide la versión (y que el merge
#     automático exige: exactamente una `semver:*`). Las dos ramas, para que el aviso llegue al
#     abrir la PR y no al cortar la release.
#
#  2. `runs-on: ubuntu-latest` fijo, NUNCA `vars.RUNNER_TARGET`. Este repo se gobierna como
#     público, y apuntar `runs-on` a una máquina propia del estudio desde un repo público es una
#     brecha, no una preferencia de facturación: una PR desde un fork ejecuta el workflow DEL
#     FORK, o sea código de un tercero, en esa máquina. `security/check-no-selfhosted.sh` lo
#     audita cada semana — y busca el literal, así que este comentario lo evita a propósito:
#     el guard prefiere un falso positivo a un patrón debilitado, y lleva escrito desde su
#     creación que la respuesta correcta es reescribir la prosa, no relajar la búsqueda.

name: Require semver label

# Toda PR a `develop` o a `main` debe llevar al menos una etiqueta semver:* — la más alta
# (major>minor>patch>none) decide el salto de versión del siguiente release.
#
# Esto es un AVISO, no una barrera: con la protección de rama aplicada, el check obligatorio es
# `validate actions`, no este, así que un rojo aquí no impide mergear. El respaldo real es el fallo EN DURO de
# `compute-release-version`, que se niega a cortar un release si alguna PR del rango no lleva
# etiqueta. Este workflow existe para que eso se sepa al abrir la PR y no meses después, cuando
# el release se muere y hay que retroetiquetar a mano — que es exactamente lo que hubo que hacer
# el 2026-08-09 con 62 PRs ya mergeadas.
on:
  pull_request:
    branches: [main, develop]
    types: [opened, labeled, unlabeled, synchronize]

concurrency:
  # `cancel-in-progress: false` NO esta puesto por poner el valor por defecto: ES el arreglo.
  #
  # Una PR creada con su etiqueta en la MISMA llamada (`gh pr create --label`, que es lo que hace
  # el envoltorio del estudio) dispara DOS eventos, `opened` y `labeled`, y por tanto dos runs en
  # este mismo grupo. Con `cancel-in-progress: true` una MATA a la otra — y el check `cancelled`
  # que deja NO desaparece: se queda pegado al commit, la PR pasa a `UNSTABLE` y GitHub la pinta
  # en rojo aunque el gate haya salido verde. Medido el 2026-08-25 sobre el historial de este
  # workflow en los OCHO repos que lo tienen: entre el 16% y el 56% de las runs acaban
  # `cancelled`, y en dos de ellos hay MAS cancelled que success. Un check que sale rojo la mitad
  # de las veces sin que pase nada deja de significar nada: entrena a ignorar el rojo.
  #
  # Cancelar aqui no ahorra nada que valga ese precio: el job es un `curl` y un `jq`, ~20 s. Con
  # `false` las runs del grupo se SERIALIZAN en vez de matarse, asi que la ultima en reportar
  # sigue siendo la del ultimo evento —lo unico que la cancelacion aportaba— y no se fabrica
  # ningun `cancelled`.
  #
  # Y NO se arregla quitando `opened` de los `types`: una PR abierta SIN etiqueta no dispararia
  # nada, el check no existiria y el gate desapareceria en silencio. Un fail-open es peor que un
  # rojo.
  #
  # El grupo es por PR Y POR COMMIT (`head.sha`; `github.sha` si el evento no trae PR). Con `false`,
  # GitHub no mata la run en marcha, pero de las que ESPERAN solo deja la ultima: descarta la otra
  # sin jobs y sin check. Y las runs no se crean en el orden de sus eventos: con el grupo por PR, un
  # `labeled` del commit viejo creado tarde descartaba la espera del `synchronize` del nuevo, y ese
  # commit se quedaba sin este check para siempre. Por commit solo se juntan las runs de un mismo
  # commit (`opened`/`labeled`/`unlabeled` sin push), y la que queda es siempre de ese commit.
  group: require-semver-label-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

permissions:
  contents: read
  # Desde que el paso lee las etiquetas de la API y no del payload del evento (ver el paso).
  pull-requests: read

jobs:
  require-semver-label:
    name: require-semver-label
    runs-on: ubuntu-latest
    steps:
      - name: At least one semver:* label
        shell: bash
        env:
          # Las etiquetas se leen de la API, NO de `github.event.pull_request.labels`.
          #
          # Ese campo es la FOTO del payload del evento, no el estado vivo: el comentario que habia
          # aqui decia lo contrario ("the live label set for the PR") y era falso. Una PR creada con
          # su etiqueta en la MISMA llamada dispara `opened` y `labeled` sobre el mismo commit, y el
          # payload de `opened` puede llegar SIN la etiqueta. Las dos runs caen en el mismo grupo y
          # se serializan (ver `concurrency`); si GitHub crea la de `opened` despues, es la ultima
          # en reportar y deja el check en rojo sobre una PR que SI lleva la etiqueta.
          #
          # Y relanzarla no lo arreglaba: un re-run reejecuta con el MISMO payload viejo, asi que
          # hacia falta quitar y volver a poner la etiqueta para forzar un evento nuevo. Leyendo la
          # API, cualquier run (la ultima en reportar o un re-run) juzga las etiquetas que la PR
          # tiene AHORA.
          #
          # `curl` y `jq`, sin `node -e`: es la misma forma que el gate homologo de los productos, y
          # las dos herramientas vienen en la imagen hosted. `issue_url` viene en todo payload de
          # `pull_request`; el `format(...)` es solo una red.
          GH_TOKEN: ${{ github.token }}
          LABELS_URL: ${{ github.event.pull_request.issue_url || format('{0}/repos/{1}/issues/{2}', github.api_url, github.repository, github.event.pull_request.number) }}
        run: |
          set -euo pipefail
          # Fail-closed: si la API no contesta, el gate NO se pone verde por defecto.
          body="$(curl -sSf -H "Authorization: Bearer ${GH_TOKEN}" \
                            -H 'Accept: application/vnd.github+json' \
                            "${LABELS_URL}/labels?per_page=100")" || {
            echo "::error::could not read the PR labels from the API (${LABELS_URL}/labels)"; exit 1; }
          echo "live labels: $(printf '%s' "$body" | jq -rc '[.[].name]')"
          count="$(printf '%s' "$body" \
            | jq -r '[.[].name | select(test("^semver:(major|minor|patch|none)$"))] | length')"
          if [ "$count" -ge 1 ]; then
            echo "OK: ${count} semver:* label(s) present; the highest (major>minor>patch>none) drives the release bump."
            exit 0
          fi
          echo "::error::This PR has no semver:* label; at least one of semver:major|minor|patch|none is required."
          echo "Add one of: semver:major, semver:minor, semver:patch, semver:none."
          echo "Use semver:none for changes that do not affect consumers (docs, CI, internal chore)."
          exit 1
